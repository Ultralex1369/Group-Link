<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link</title>

    <link rel="stylesheet" href="style.css">

    <script type="module" src="app.js"></script>
</head>

<body>

<div id="loginScreen">

    <h1>Group Link</h1>

    <input
        id="codeInput"
        type="password"
        maxlength="10"
        autocomplete="off"
        placeholder="Enter Code">

    <div id="loginError" class="error"></div>

    <button id="continueBtn">
        Continue
    </button>

</div>


<div id="chatScreen" style="display:none;">

    <div id="welcomeText"></div>

    <h2 id="groupTitle">Conversation</h2>

    <div id="messages"></div>

    <input
        id="messageInput"
        maxlength="1000"
        autocomplete="off"
        placeholder="Type a message">

    <button id="sendBtn">
        Send
    </button>

    <button id="logoutBtn" class="secondary">
        Log out
    </button>

</div>

</body>
</html>
